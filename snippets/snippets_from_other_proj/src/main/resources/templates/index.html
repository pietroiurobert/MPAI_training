<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Parking App</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<h1>Parking Spots</h1>

<div th:if="${message}" class="notification">
    <span th:text="${message}"></span>
</div>
<h2>All Spots</h2>
<table>
    <tr>
        <th>ID</th>
        <th>Status</th>
        <th>Action</th>
    </tr>
    <tr th:each="spot : ${allSpots}">
        <td th:text="${spot.id}"></td>
        <td th:text="${spot.available ? 'Free' : (spot.paid ? 'Paid' : 'Reserved')}"></td>
        <td>
            <a th:if="${spot.available && !spot.paid}" th:href="@{/reserve/{id}(id=${spot.id})}" class="btn reserve">Reserve</a>
            <form th:if="${!spot.available && !spot.paid}" th:action="@{/pay/{id}(id=${spot.id})}" method="post">
                <select name="method">
                    <option value="CARD">Card</option>
                    <option value="CASH">Cash</option>
                </select>
                <button type="submit" class="btn pay">Pay</button>
            </form>
            <form th:if="${!spot.available && spot.paid}" th:action="@{/endReservation/{id}(id=${spot.id})}" method="post">
                <button type="submit" class="btn endReservation">End reservation</button>
            </form>
        </td>
    </tr>
</table>

<h2>Paid Spots</h2>
<table>
    <tr>
        <th>ID</th>
        <th>Status</th>
    </tr>
    <tr th:each="spot : ${paidSpots}">
        <td th:text="${spot.id}"></td>
        <td>Paid</td>
    </tr>
</table>

<h2>Free Spots</h2>
<table>
    <tr>
        <th>ID</th>
        <th>Status</th>
    </tr>
    <tr th:each="spot : ${freeSpots}">
        <td th:text="${spot.id}"></td>
        <td>Free</td>
    </tr>
</table>

</body>
</html>
